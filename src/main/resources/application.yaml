spring:
  application:
    name: inmoco
  datasource:
    url: jdbc:mysql://localhost:3307/inmoco_db?useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true
    username: root
    password: 
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  thymeleaf:
    cache: false

server:
  port: 8080

logging:
  level:
    inmoco: DEBUG

spring:
  sql:
    init:
      mode: always
      schema-locations: classpath:db/inmoco_db.sql