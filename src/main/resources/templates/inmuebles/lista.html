<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inmuebles - InmoCO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        .property-card {
            transition: all 0.3s ease;
            border: none;
            border-radius: 12px;
            overflow: hidden;
        }
        .property-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
        }
        .property-img {
            height: 220px;
            object-fit: cover;
        }
        .price {
            font-size: 1.4rem;
            font-weight: bold;
            color: #10b981;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">InmoCO</a>
            <div>
                <a th:href="@{/inmuebles/nuevo}" class="btn btn-success me-2">+ Publicar Inmueble</a>
                <a th:href="@{/logout}" class="btn btn-outline-light">Cerrar Sesión</a>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Inmuebles Disponibles</h2>
            <a th:href="@{/inmuebles/nuevo}" class="btn btn-success">+ Nuevo Inmueble</a>
        </div>

        <div class="row" th:if="${inmuebles != null and !inmuebles.isEmpty()}">
            <div class="col-md-4 mb-4" th:each="inmueble : ${inmuebles}">
                <div class="property-card h-100 shadow-sm bg-white">
                    <img th:src="${inmueble.imagenes != null and !inmueble.imagenes.isEmpty() ? inmueble.imagenes[0].url : 'https://source.unsplash.com/random/400x300/?house'}" 
                         class="property-img w-100" alt="Inmueble">
                    
                    <div class="p-4">
                        <h5 class="fw-bold" th:text="${inmueble.titulo}"></h5>
                        <p class="text-muted small" th:text="${inmueble.ciudad}"></p>
                        
                        <div class="d-flex justify-content-between align-items-end">
                            <div>
                                <span class="price" th:text="${'$' + inmueble.precio}"></span>
                            </div>
                            <a th:href="@{/inmuebles/editar/{id}(id=${inmueble.id})}" class="btn btn-sm btn-outline-primary">Editar</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div th:if="${inmuebles == null or inmuebles.isEmpty()}" class="text-center py-5">
            <h4>No hay inmuebles disponibles aún</h4>
            <a th:href="@{/inmuebles/nuevo}" class="btn btn-success mt-3">Publicar el primero</a>
        </div>
    </div>
</body>
</html>
