<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Publicar Inmueble - InmoCO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        .form-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">InmoCO</a>
            <a th:href="@{/inmuebles}" class="btn btn-outline-light">Volver a Inmuebles</a>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="form-card p-5">
                    <h2 class="text-center mb-4" th:text="${inmueble.id != null ? 'Editar Inmueble' : 'Publicar Nuevo Inmueble'}"></h2>

                    <form th:action="@{/inmuebles}" method="post" th:object="${inmueble}">
                        <input type="hidden" th:field="*{id}">

                        <div class="row">
                            <div class="col-md-8 mb-3">
                                <label class="form-label">Título del Inmueble</label>
                                <input type="text" th:field="*{titulo}" class="form-control" required>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Precio (COP)</label>
                                <input type="number" th:field="*{precio}" class="form-control" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Descripción</label>
                            <textarea th:field="*{descripcion}" class="form-control" rows="4" required></textarea>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Tipo</label>
                                <select th:field="*{tipo}" class="form-select">
                                    <option value="Venta">Venta</option>
                                    <option value="Arriendo">Arriendo</option>
                                    <option value="Temporal">Temporal</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Estado</label>
                                <select th:field="*{estado}" class="form-select">
                                    <option value="Disponible">Disponible</option>
                                    <option value="Vendido">Vendido</option>
                                    <option value="Arrendado">Arrendado</option>
                                </select>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Habitaciones</label>
                                <input type="number" th:field="*{habitaciones}" class="form-control">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Baños</label>
                                <input type="number" th:field="*{banos}" class="form-control">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Área (m²)</label>
                                <input type="number" th:field="*{area}" class="form-control" step="0.01">
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Ciudad</label>
                                <input type="text" th:field="*{ciudad}" class="form-control" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Dirección</label>
                                <input type="text" th:field="*{direccion}" class="form-control" required>
                            </div>
                        </div>

                        <div class="text-center mt-4">
                            <button type="submit" class="btn btn-success btn-lg px-5">Guardar Inmueble</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
