<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>InmoCO - Inmuebles en Colombia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        .hero {
            background: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.75)), url('https://source.unsplash.com/random/1920x1080/?real-estate,modern-house') center/cover no-repeat;
            height: 100vh;
            color: white;
        }
        .card-property {
            transition: all 0.3s ease;
        }
        .card-property:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.15);
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">InmoCO</a>
            <a th:href="@{/login}" class="btn btn-outline-light">Iniciar Sesión</a>
        </div>
    </nav>

    <section class="hero d-flex align-items-center text-center">
        <div class="container">
            <h1 class="display-4 fw-bold mb-3">Encuentra tu hogar ideal</h1>
            <p class="lead mb-4">La mejor plataforma inmobiliaria de Colombia</p>
            <a th:href="@{/inmuebles}" class="btn btn-primary btn-lg px-5">Explorar Inmuebles</a>
            <a th:href="@{/registro}" class="btn btn-success btn-lg px-5 ms-3">Publicar Propiedad</a>
        </div>
    </section>
</body>
</html>
