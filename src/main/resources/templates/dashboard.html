<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard - InmoCO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">InmoCO</a>
            <a th:href="@{/logout}" class="btn btn-outline-light">Cerrar Sesión</a>
        </div>
    </nav>

    <div class="container my-5">
        <h2>Bienvenido al Dashboard</h2>
        <p>Próximamente aquí verás tus propiedades y estadísticas.</p>
        <a th:href="@{/inmuebles}" class="btn btn-primary">Ver Todos los Inmuebles</a>
    </div>
</body>
</html>
